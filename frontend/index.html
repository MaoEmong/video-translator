<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Video Translator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">VIDEO TRANSLATOR</p>
        <h1>영상의 목소리를<br /><span>자막으로 바꿔보세요.</span></h1>
        <p class="hero-copy">
          영상을 업로드하면 음성을 인식하고, 원하는 언어로 번역한 자막 파일을 만들어 드립니다.
        </p>
      </header>

      <section class="panel upload-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">01 / SOURCE</p>
            <h2>영상 업로드</h2>
          </div>
          <span class="pill">OpenAI STT + LLM</span>
        </div>

        <form id="job-form">
          <label class="dropzone" for="video-file">
            <input id="video-file" type="file" accept="video/*" required />
            <span class="drop-icon">＋</span>
            <strong id="file-label">영상 파일을 선택하세요</strong>
            <small>MP4, MOV, WebM 등 · 파일은 안전한 저장소로 직접 업로드됩니다.</small>
          </label>

          <div class="form-grid">
            <label>
              <span>원본 언어</span>
              <select id="source-language">
                <option value="auto">자동 감지</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="es">Español</option>
              </select>
            </label>
            <label>
              <span>번역 언어</span>
              <select id="target-language" required>
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="es">Español</option>
              </select>
            </label>
            <label>
              <span>번역 스타일</span>
              <select id="translation-style">
                <option value="natural">자연스러운 자막체</option>
                <option value="literal">직역 중심</option>
                <option value="formal">격식 있는 표현</option>
              </select>
            </label>
          </div>

          <button class="primary-button" type="submit" id="submit-button">번역 시작하기 <span>→</span></button>
        </form>
      </section>

      <section class="panel progress-panel hidden" id="progress-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">02 / PROCESSING</p>
            <h2>번역 진행 상황</h2>
          </div>
          <strong id="progress-value">0%</strong>
        </div>
        <div class="progress-track"><div id="progress-bar"></div></div>
        <div class="status-row">
          <span id="job-status">작업을 준비하고 있습니다.</span>
          <span id="job-id" class="muted"></span>
        </div>
        <p id="error-message" class="error hidden"></p>
      </section>

      <section class="panel editor-panel hidden" id="editor-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">03 / REVIEW</p>
            <h2>자막 검토</h2>
          </div>
          <div class="export-actions">
            <select id="export-format" aria-label="자막 형식">
              <option value="srt">SRT</option>
              <option value="vtt">VTT</option>
            </select>
            <button class="secondary-button" id="export-button" type="button">파일 만들기</button>
          </div>
        </div>
        <p class="helper">번역문이나 표시 시간을 수정한 뒤 각 행의 저장 버튼을 누르세요.</p>
        <div id="segments" class="segments"></div>
        <div id="download-area" class="download-area hidden"></div>
      </section>

      <footer>
        <span>Video Translator · MVP</span>
        <span>긴 영상은 처리 시간이 더 걸릴 수 있습니다.</span>
      </footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
